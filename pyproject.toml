[project]
name = "2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.7.0",
    "evaluate>=0.4.6",
    "ipykernel>=7.2.0",
    "pandas>=3.0.1",
    "polars>=1.38.1",
    "scikit-learn>=1.8.0",
    "setuptools<82",
    "tensorboard>=2.20.0",
    "torchvision>=0.25.0",
    "transformers[torch]<4.59",
    "wandb>=0.25.0",
]


[project.optional-dependencies]
cpu = [
  "torch",
  "torchvision",
]
cu126 = [
  "torch",
  "torchvision",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true